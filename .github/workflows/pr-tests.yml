name: Guarded Unit Tests
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Aiken compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/aiken-cli"
          gh release download v1.1.22 --repo aiken-lang/aiken --pattern 'aiken-x86_64-unknown-linux-musl.tar.gz*' --dir "$RUNNER_TEMP/aiken-cli"
          cd "$RUNNER_TEMP/aiken-cli"
          sha256sum -c aiken-x86_64-unknown-linux-musl.tar.gz.sha256
          tar -xzf aiken-x86_64-unknown-linux-musl.tar.gz
          echo "$RUNNER_TEMP/aiken-cli/aiken-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm test
