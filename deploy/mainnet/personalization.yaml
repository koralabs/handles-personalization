schema_version: 3
network: mainnet
subhandle_strategy:
  namespace: handlecontract
  format: contract_slug_ordinal
contracts:
  # Canonical slugs per adahandle-deployments/docs/contract-deployment-pipeline.md:
  # `<app><role>[<extra>]`, ≤10 chars, no separators. The `pers` app split
  # into proxy + per-redeemer-variant observers to fit Conway's 16384
  # max_tx_size, plus a `persdsg` observer for designer-settings validation
  # on perspz's behalf. persdsg MUST be deployed before perspz — perspz
  # hardcodes persdsg's hash via persdsg_hash in update.ak.
  - contract_slug: persdsg
    script_type: persdsg
    old_script_type: null
    deployment_handle_slug: persdsg
    build:
      target: aiken/validators/persdsg.ak
      kind: validator
      parameters: {}
  - contract_slug: perslfc
    script_type: perslfc
    old_script_type: null
    deployment_handle_slug: perslfc
    build:
      target: aiken/validators/perslfc.ak
      kind: validator
      parameters: {}
  - contract_slug: persprx
    script_type: persprx
    old_script_type: pz
    deployment_handle_slug: persprx
    build:
      target: aiken/validators/persprx.ak
      kind: validator
      parameters: {}
  - contract_slug: perspz
    script_type: perspz
    old_script_type: null
    deployment_handle_slug: perspz
    build:
      target: aiken/validators/perspz.ak
      kind: validator
      parameters: {}
assigned_handles:
  settings:
    - pers@handle_settings
    - pers_bg@handle_settings
    - pers_pfp@handle_settings
  scripts:
    # PZ V3 split: four active validators (proxy + per-redeemer-variant
    # observers + designer-settings observer). All four are marked active so
    # api.handle.me/scripts reports `latest: true` for each, and the BFF
    # discovers them per-validator-role via /scripts.
    # The four canonical ord-1 SubHandles will rest at the handlecontract
    # multisig with their V3 ref-script attached, mirroring the preprod
    # cutover pattern (preprod txs 2026-05-15:
    # persdsg=efb84141, perspz=76988cd1, perslfc=b0e6ce1e, persprx=9f19423c).
    # Legacy `pz_contract_04` is retained until in-flight V2-resident
    # personalizations have all auto-migrated to V3.
    - persdsg1@handlecontract
    - perslfc1@handlecontract
    - persprx1@handlecontract
    - perspz1@handlecontract
    - pz_contract_04
ignored_settings: []
